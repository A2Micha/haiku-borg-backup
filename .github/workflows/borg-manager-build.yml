name: Borg Manager Scheduler Upgrade

on:
  push:
    branches: [borg-manager-mvp]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: borg-manager-mvp
          fetch-depth: 0
      - name: Install advanced scheduler picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/main.tsx')
          text = path.read_text()
          start = text.index('function Schedules(){')
          end = text.index('\n\nfunction Archives(){', start)
          new = r'''function Schedules(){
  const [repos,setRepos]=useState<Repository[]>([])
  const [items,setItems]=useState<Schedule[]>([])
  const [msg,setMsg]=useState('')
  const [form,setForm]=useState({name:'Nightly',repository_id:'',frequency:'daily',minuteInterval:'15',hourInterval:'6',hour:'02',minute:'00',weekday:'1',monthday:'1',selectedDays:['1'] as string[],sources:'/host',compression:'zstd,3',excludes:''})
  const hours=Array.from({length:24},(_,i)=>String(i).padStart(2,'0'))
  const minutes=Array.from({length:60},(_,i)=>String(i).padStart(2,'0'))
  const minuteIntervals=['5','10','15','20','30']
  const hourIntervals=['1','2','3','4','6','8','12']
  const weekdays=[['1','Monday'],['2','Tuesday'],['3','Wednesday'],['4','Thursday'],['5','Friday'],['6','Saturday'],['0','Sunday']]
  const buildCron=()=>{
    const m=Number(form.minute),h=Number(form.hour)
    if(form.frequency==='minutes')return `*/${form.minuteInterval} * * * *`
    if(form.frequency==='hours')return `${m} */${form.hourInterval} * * *`
    if(form.frequency==='weekdays')return `${m} ${h} * * 1-5`
    if(form.frequency==='weekends')return `${m} ${h} * * 6,0`
    if(form.frequency==='selectedDays')return `${m} ${h} * * ${form.selectedDays.length?form.selectedDays.join(','):'1'}`
    if(form.frequency==='weekly')return `${m} ${h} * * ${form.weekday}`
    if(form.frequency==='monthly')return `${m} ${h} ${form.monthday} * *`
    return `${m} ${h} * * *`
  }
  const dayNames=(days:string[])=>days.map(d=>weekdays.find(x=>x[0]===d)?.[1]).filter(Boolean).join(', ')
  const preview=()=>{
    const time=`${form.hour}:${form.minute}`
    if(form.frequency==='minutes')return `Every ${form.minuteInterval} minutes`
    if(form.frequency==='hours')return form.hourInterval==='1'?`Every hour at minute ${form.minute}`:`Every ${form.hourInterval} hours at minute ${form.minute}`
    if(form.frequency==='weekdays')return `Monday to Friday at ${time}`
    if(form.frequency==='weekends')return `Saturday and Sunday at ${time}`
    if(form.frequency==='selectedDays')return `${dayNames(form.selectedDays)||'Monday'} at ${time}`
    if(form.frequency==='weekly')return `Every ${weekdays.find(x=>x[0]===form.weekday)?.[1]||'week'} at ${time}`
    if(form.frequency==='monthly')return `Every month on day ${form.monthday} at ${time}`
    return `Every day at ${time}`
  }
  const describeCron=(cron:string)=>{
    const [m,h,d,_month,dow]=cron.trim().split(/\s+/)
    if(m?.startsWith('*/')&&h==='*')return `Every ${m.slice(2)} minutes`
    if(h?.startsWith('*/')&&d==='*'&&dow==='*')return `Every ${h.slice(2)} hours at minute ${String(m).padStart(2,'0')}`
    const mm=String(m).padStart(2,'0'),hh=String(h).padStart(2,'0')
    if(d==='*'&&dow==='*')return `Every day at ${hh}:${mm}`
    if(d==='*'&&dow==='1-5')return `Monday to Friday at ${hh}:${mm}`
    if(d==='*'&&dow==='6,0')return `Saturday and Sunday at ${hh}:${mm}`
    if(d==='*'&&dow?.includes(','))return `${dayNames(dow.split(','))} at ${hh}:${mm}`
    if(d==='*'&&weekdays.some(x=>x[0]===dow))return `Every ${weekdays.find(x=>x[0]===dow)?.[1]} at ${hh}:${mm}`
    if(d!=='*'&&dow==='*')return `Every month on day ${d} at ${hh}:${mm}`
    return cron
  }
  const toggleDay=(value:string)=>setForm(f=>({...f,selectedDays:f.selectedDays.includes(value)?f.selectedDays.filter(d=>d!==value):[...f.selectedDays,value]}))
  const load=async()=>{const r=await api.get<Repository[]>('/repositories');setRepos(r);setForm(f=>({...f,repository_id:f.repository_id||String(r[0]?.id||'')}));setItems(await api.get('/schedules'))}
  useEffect(()=>{void load();const t=setInterval(()=>void load(),15000);return()=>clearInterval(t)},[])
  async function create(e:React.FormEvent){e.preventDefault();if(form.frequency==='selectedDays'&&!form.selectedDays.length){setMsg('Select at least one weekday.');return}try{await api.post('/schedules',{name:form.name,repository_id:Number(form.repository_id),cron:buildCron(),sources:form.sources.split(',').map(x=>x.trim()).filter(Boolean),compression:form.compression,excludes:form.excludes.split(',').map(x=>x.trim()).filter(Boolean),enabled:true});setMsg(`Schedule registered: ${preview()}.`);await load()}catch(e:any){setMsg(e.message)}}
  const showClock=!['minutes','hours'].includes(form.frequency)
  return <section className="section"><SectionTitle eyebrow="AUTOMATION" title="Schedules" subtitle="Choose precise intervals and days — Borg Manager generates the technical schedule automatically."/><div className="split"><Card><form onSubmit={create}><label>Name<input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></label><label>Repository<select value={form.repository_id} onChange={e=>setForm({...form,repository_id:e.target.value})}>{repos.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</select></label><label>Frequency<select value={form.frequency} onChange={e=>setForm({...form,frequency:e.target.value})}><option value="minutes">Every few minutes</option><option value="hours">Every few hours</option><option value="daily">Every day</option><option value="weekdays">Monday – Friday</option><option value="weekends">Weekend</option><option value="selectedDays">Selected weekdays</option><option value="weekly">Once a week</option><option value="monthly">Once a month</option></select></label>
  {form.frequency==='minutes'&&<label>Interval<select value={form.minuteInterval} onChange={e=>setForm({...form,minuteInterval:e.target.value})}>{minuteIntervals.map(v=><option key={v} value={v}>Every {v} minutes</option>)}</select></label>}
  {form.frequency==='hours'&&<div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:10}}><label>Interval<select value={form.hourInterval} onChange={e=>setForm({...form,hourInterval:e.target.value})}>{hourIntervals.map(v=><option key={v} value={v}>{v==='1'?'Every hour':`Every ${v} hours`}</option>)}</select></label><label>Start minute<select value={form.minute} onChange={e=>setForm({...form,minute:e.target.value})}>{minutes.map(v=><option key={v} value={v}>{v}</option>)}</select></label></div>}
  {showClock&&<div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:10}}><label>Hour<select value={form.hour} onChange={e=>setForm({...form,hour:e.target.value})}>{hours.map(v=><option key={v} value={v}>{v}:00</option>)}</select></label><label>Minute<select value={form.minute} onChange={e=>setForm({...form,minute:e.target.value})}>{minutes.map(v=><option key={v} value={v}>{v}</option>)}</select></label></div>}
  {form.frequency==='weekly'&&<label>Weekday<select value={form.weekday} onChange={e=>setForm({...form,weekday:e.target.value})}>{weekdays.map(([value,label])=><option key={value} value={value}>{label}</option>)}</select></label>}
  {form.frequency==='selectedDays'&&<div><label>Weekdays</label><div style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:7,marginTop:6}}>{weekdays.map(([value,label])=><button type="button" key={value} className={form.selectedDays.includes(value)?'ghost active':'ghost'} style={form.selectedDays.includes(value)?{borderColor:'#6d7cff',color:'#fff',background:'#202c4b'}:{}} onClick={()=>toggleDay(value)}>{label.slice(0,3)}</button>)}</div></div>}
  {form.frequency==='monthly'&&<label>Day of month<select value={form.monthday} onChange={e=>setForm({...form,monthday:e.target.value})}>{Array.from({length:31},(_,i)=>i+1).map(v=><option key={v} value={String(v)}>{v}</option>)}</select></label>}
  <Hint><b>{preview()}</b><br/>Technical schedule: <code>{buildCron()}</code></Hint><label>Sources<input value={form.sources} onChange={e=>setForm({...form,sources:e.target.value})}/></label><label>Compression<select value={form.compression} onChange={e=>setForm({...form,compression:e.target.value})}><option>zstd,3</option><option>zstd,6</option><option>lz4</option></select></label><label>Excludes<input value={form.excludes} onChange={e=>setForm({...form,excludes:e.target.value})}/></label><button disabled={!form.repository_id}><CalendarClock size={16}/>Create schedule</button>{msg&&<Notice text={msg}/>}</form></Card><div className="stack">{items.map(s=><div className="scheduleCard" key={s.id}><div className="rowIcon"><CalendarClock/></div><div className="grow"><b>{s.name}</b><small>{describeCron(s.cron)}</small><code>{s.cron}</code><small>Next: {fmtDate(s.next_run_at)} · {s.sources.join(', ')}</small></div><div className="actions"><button className="ghost" onClick={async()=>{await api.post(`/schedules/${s.id}/run`);setMsg(`${s.name} queued.`)}}><Play size={15}/>Run now</button><button className="danger ghost" onClick={async()=>{await api.del(`/schedules/${s.id}`);await load()}}><Trash2 size={15}/></button></div></div>)}{!items.length&&<Card><Empty text="No schedules configured."/></Card>}</div></div></section>
}'''
          path.write_text(text[:start] + new + text[end:])
          PY
      - name: Restore normal CI workflow and commit
        run: |
          cat > .github/workflows/borg-manager-build.yml <<'EOF'
          name: Borg Manager Build

          on:
            push:
              branches: [borg-manager-mvp]
            pull_request:
              branches: [borg-manager-mvp]

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Build Docker images
                  run: docker compose build
          EOF
          rm -f .github/workflows/upgrade-scheduler-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx .github/workflows/borg-manager-build.yml .github/workflows/upgrade-scheduler-ui.yml
          git commit -m "Add fine-grained schedule interval picker"
          git push origin HEAD:borg-manager-mvp
