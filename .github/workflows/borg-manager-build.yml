name: Borg Manager Build

on:
  push:
    branches: [borg-manager-mvp]
  pull_request:
    branches: [borg-manager-mvp]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    env:
      MOCK_BORG: "1"
      APP_SECRET: "ci-only-secret-do-not-use-in-production"
      PORT: "8081"
      TZ: "Europe/Berlin"
      BORG_REPO_ROOT: ${{ github.workspace }}/repositories
      HOST_ROOT: ${{ github.workspace }}/demo-sources
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for healthy frontend
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: API smoke test
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8081/api"

          def request(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  method=method,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      raw = response.read().decode()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f"{method} {path} -> {exc.code}: {exc.read().decode()}") from exc

          health = request("GET", "/health")
          assert health["ok"] is True
          assert health["mock_borg"] is True
          assert health["scheduler_running"] is True
          assert health["borg_repo_host_root"] == os.environ["BORG_REPO_ROOT"]
          assert health["host_source_root"] == os.environ["HOST_ROOT"]

          host_repo = os.path.join(os.environ["BORG_REPO_ROOT"], "ci-repository")
          host_source = os.environ["HOST_ROOT"]

          repo = request("POST", "/repositories", {
              "name": "ci-repository",
              "location": host_repo,
              "passphrase": "ci-passphrase",
              "initialize": True,
              "encryption": "repokey-blake2",
          })
          repo_id = repo["id"]

          job = request("POST", "/backups", {
              "repository_id": repo_id,
              "sources": [host_source],
              "compression": "zstd,3",
              "excludes": [],
          })

          deadline = time.time() + 15
          current = job
          while time.time() < deadline:
              current = request("GET", f"/jobs/{job['id']}")
              if current["status"] in {"success", "failed", "cancelled", "interrupted"}:
                  break
              time.sleep(0.25)
          assert current["status"] == "success", current

          schedule = request("POST", "/schedules", {
              "name": "CI every 15 minutes",
              "repository_id": repo_id,
              "cron": "*/15 * * * *",
              "sources": [host_source],
              "compression": "zstd,3",
              "excludes": [],
              "enabled": True,
          })
          assert schedule["next_run_at"], schedule

          metrics = request("GET", "/metrics")
          assert len(metrics["repositories"]) == 1, metrics
          assert metrics["repositories"][0]["ok"] is True, metrics

          print("API smoke test passed")
          PY

      - name: Real Borg smoke test
        run: |
          docker compose exec -T backend borg --version
          docker compose exec -T -e BORG_PASSPHRASE=ci-real-pass backend borg init --encryption=repokey-blake2 /repos/ci-real-borg
          docker compose exec -T -e BORG_PASSPHRASE=ci-real-pass backend borg create --stats /repos/ci-real-borg::smoke /sources
          docker compose exec -T -e BORG_PASSPHRASE=ci-real-pass backend borg list /repos/ci-real-borg | grep smoke

      - name: Verify database persistence after backend restart
        run: |
          docker compose restart backend
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          import urllib.request

          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:8081/api" + path, timeout=10) as r:
                  return json.loads(r.read().decode())

          repos = get("/repositories")
          schedules = get("/schedules")
          health = get("/health")
          assert any(r["name"] == "ci-repository" for r in repos), repos
          assert any(s["name"] == "CI every 15 minutes" for s in schedules), schedules
          assert health["scheduler_running"] is True, health
          print("Persistence/restart smoke test passed")
          PY

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
