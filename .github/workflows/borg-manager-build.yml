name: Borg Manager Scheduler Upgrade

on:
  push:
    branches: [borg-manager-mvp]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: borg-manager-mvp
          fetch-depth: 0
      - name: Install advanced scheduler picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          encoded = ''
          new = base64.b64decode(encoded).decode()
          path = Path('frontend/src/main.tsx')
          text = path.read_text()
          start = text.index('function Schedules(){')
          end = text.index('\n\nfunction Archives(){', start)
          path.write_text(text[:start] + new + text[end:])
          PY
      - name: Commit scheduler UI only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git commit -m "Add fine-grained schedule interval picker"
          git push origin HEAD:borg-manager-mvp
