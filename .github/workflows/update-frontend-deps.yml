name: Update frontend build dependencies

on:
  push:
    paths:
      - '.github/workflows/update-frontend-deps.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: borg-manager-mvp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Update patched Vite and classify build dependencies
        working-directory: frontend
        run: |
          npm install --save-dev --save-exact vite@7.3.5 @vitejs/plugin-react@5.0.2 typescript@5.9.2 --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "Update patched frontend build dependencies"
          git push origin HEAD:borg-manager-mvp
